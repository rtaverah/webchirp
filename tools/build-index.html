<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>WebCHIRP · Generar models.json</title>
  <style>body{font:14px system-ui,sans-serif;margin:1rem}textarea{width:100%;height:50vh}</style>
</head>
<body>
  <h1>Generar <code>models.json</code></h1>
  <p>Carga todos los drivers de CHIRP en el navegador y arma el índice de modelos (id, marca, modelo, variante,
     alias y módulo del driver). Hay que repetirlo después de cada <code>./build.sh</code>.</p>
  <p id="status">Cargando…</p>
  <button id="dl" disabled>Descargar models.json</button>
  <textarea id="out" readonly></textarea>
  <script type="module">
    import { Engine } from '../js/engine.js';
    const engine = new Engine();
    const status = document.getElementById('status');
    let json = '';
    try {
      await engine.load((s) => { status.textContent = s; });
      status.textContent = 'Importando todos los drivers…';
      const radios = await engine.listRadios();
      json = JSON.stringify({ version: 1, generated: new Date().toISOString(), count: radios.length, radios });
      document.getElementById('out').value = json;
      document.getElementById('dl').disabled = false;
      status.textContent = `Listo: ${radios.length} modelos/alias, ${engine.failedDrivers?.length || 0} drivers con error de carga.`;
      if (new URLSearchParams(location.search).has('post')) {
        await fetch('/__result', { method: 'POST', body: JSON.stringify({ type: 'models', json, failed: engine.failedDrivers || [] }) });
      }
    } catch (e) { status.textContent = 'Error: ' + e.message; }
    document.getElementById('dl').onclick = () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
      a.download = 'models.json';
      a.click();
    };
  </script>
</body>
</html>
